name: decode-design-preview-images

on:
  push:
    branches:
      - redesign/harusapo-v1

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: redesign/harusapo-v1

      - name: Check READY sentinel
        id: guard
        run: |
          if [ -f _b64tmp/READY ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "READY sentinel not found. Skipping (waiting for all base64 chunks)."
          fi

      - name: Decode base64 chunks to WebP
        if: steps.guard.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p design-preview-responsive-final/img
          for name in fv room konnakoto bento kotsuhi doko taikendan step1 step2 step3; do
            cat _b64tmp/"$name".webp.b64.* | base64 -d > design-preview-responsive-final/img/"$name".webp
          done
          ls -la design-preview-responsive-final/img

      - name: Verify SHA, format and size
        if: steps.guard.outputs.ready == 'true'
        run: |
          set -euo pipefail
          fail=0
          while read -r sha size name; do
            path="design-preview-responsive-final/img/$name"
            actual_sha=$(git hash-object "$path")
            actual_size=$(stat -c%s "$path")
            format=$(file -b "$path")
            echo "$name expected_sha=$sha actual_sha=$actual_sha expected_size=$size actual_size=$actual_size format=$format"
            [ "$actual_sha" = "$sha" ] || { echo "::error::SHA mismatch for $name"; fail=1; }
            [ "$actual_size" = "$size" ] || { echo "::error::size mismatch for $name"; fail=1; }
            echo "$format" | grep -qi 'web/p' || { echo "::error::format check failed for $name"; fail=1; }
          done < _b64tmp/expected.txt
          exit "$fail"

      - name: Commit images and remove temp base64 files
        if: steps.guard.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r -q _b64tmp
          git add design-preview-responsive-final/img
          git commit -m "Add design-preview-responsive-final/img images (decoded from base64 by GitHub Actions)"
          git pull --rebase origin redesign/harusapo-v1
          git push origin HEAD:redesign/harusapo-v1
